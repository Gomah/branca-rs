name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch, tags and GitHub releases
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-binstall
      - name: Install the wasm-bindgen CLI pinned by Cargo.lock
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)
          cargo binstall --no-confirm --force "wasm-bindgen-cli@${VERSION}"
      - uses: oven-sh/setup-bun@v2
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # No NPM_TOKEN: `npm publish` (run by `changeset publish`, which builds and checks the package
      # through prepublishOnly) authenticates with the workflow's OIDC token. The version script also sets
      # the agent skills' library_version to the new version in the release PR.
      - uses: changesets/action@v2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          pr-title: "chore: release"
          commit-message: "chore: release"
