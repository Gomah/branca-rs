[package]
name = "branca-core"
version = "0.1.0"
description = "Branca token core (IETF XChaCha20-Poly1305 + base62), compiled to WebAssembly for the branca-rs npm package"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
# The reference Rust implementation, used only to cross-check interoperability.
branca = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
